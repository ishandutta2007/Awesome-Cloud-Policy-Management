<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 44px; fill: url(#textGrad); }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .pill-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
    
    /* Background Dynamic Floating Nodes */
    .node-pulse {
      animation: pulse 4s ease-in-out infinite alternate;
    }
    .flow-line {
      stroke-dasharray: 8 8;
      animation: dash 20s linear infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      100% { opacity: 0.7; transform: scale(1.02); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -100; }
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)" />

  <!-- Background Dynamic Mesh Network (Behind text foreground) -->
  <g opacity="0.25">
    <line x1="100" y1="50" x2="300" y2="120" stroke="#38bdf8" stroke-width="1.5" class="flow-line" />
    <line x1="300" y1="120" x2="200" y2="240" stroke="#818cf8" stroke-width="1.5" class="flow-line" />
    <line x1="900" y1="60" x2="1050" y2="150" stroke="#c084fc" stroke-width="1.5" class="flow-line" />
    <line x1="1050" y1="150" x2="950" y2="250" stroke="#38bdf8" stroke-width="1.5" class="flow-line" />
    
    <circle cx="100" cy="50" r="6" fill="#38bdf8" class="node-pulse" />
    <circle cx="300" cy="120" r="8" fill="#818cf8" class="node-pulse" />
    <circle cx="200" cy="240" r="5" fill="#c084fc" class="node-pulse" />
    <circle cx="900" cy="60" r="7" fill="#38bdf8" class="node-pulse" />
    <circle cx="1050" cy="150" r="9" fill="#c084fc" class="node-pulse" />
    <circle cx="950" cy="250" r="6" fill="#818cf8" class="node-pulse" />
  </g>

  <!-- Shield Icon Graphic -->
  <g transform="translate(70, 85)" filter="url(#glow)">
    <path d="M45 0 L90 20 V50 C90 77.5 70.8 102.8 45 110 C19.2 102.8 0 77.5 0 50 V20 L45 0 Z" fill="url(#accentGrad)" opacity="0.85" />
    <path d="M45 22 L70 34 V54 C70 70 59.3 84.6 45 89 C30.7 84.6 20 70 20 54 V34 L45 22 Z" fill="#0f172a" />
    <path d="M38 52 L44 58 L58 42" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- FOREGROUND TEXT & CONTENT (Ensured non-overlapping & crisp foreground positioning) -->
  <g transform="translate(190, 105)">
    <text x="0" y="0" class="title">Awesome Cloud Policy Management ☁️🔒</text>
    <text x="0" y="36" class="subtitle">Curated Guardrails, Policy-as-Code &amp; Cloud Security Posture Ecosystem</text>
  </g>

  <!-- Decorative Feature Pills (Positioned at bottom foreground) -->
  <g transform="translate(190, 195)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="160" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="20" cy="17" r="5" fill="#38bdf8" />
    <text x="34" y="21" class="pill-text">Policy-as-Code</text>

    <!-- Pill 2 -->
    <rect x="175" y="0" width="160" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="195" cy="17" r="5" fill="#818cf8" />
    <text x="209" y="21" class="pill-text">IaC Security</text>

    <!-- Pill 3 -->
    <rect x="350" y="0" width="180" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="370" cy="17" r="5" fill="#c084fc" />
    <text x="384" y="21" class="pill-text">Cloud Guardrails</text>

    <!-- Pill 4 -->
    <rect x="545" y="0" width="190" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="565" cy="17" r="5" fill="#34d399" />
    <text x="579" y="21" class="pill-text">K8s Admission</text>
  </g>
</svg>
